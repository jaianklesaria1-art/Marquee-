<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Marquee</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --ink: #f5f5f5; --muted: #a3a3a3; --accent: #FF7A00; --on-accent: #0a0a0a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; background: var(--bg); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; }
  main { max-width: 560px; text-align: center; }
  .code { margin: 0; font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(88px, 22vw, 160px); line-height: .9; color: var(--accent); }
  h1 { margin: 18px 0 10px; font-family: 'Outfit', system-ui, sans-serif; font-size: clamp(26px, 5vw, 36px); line-height: 1.1; font-weight: 600; }
  p { margin: 0 auto 28px; max-width: 42ch; color: var(--muted); font-size: 17px; line-height: 1.55; }
  nav { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1.5px solid var(--ink); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; }
  nav a:first-child { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  nav a:hover { opacity: .85; }
  nav a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <h1>This page isn&#x27;t here</h1>
  <p>The link may be old. Our fins, louvers and finished projects are a click away.</p>
  <nav aria-label="Where to go next"><a href="/">Go to the home page</a><a href="/projects">See our projects</a></nav>
</main>
</body>
</html>
