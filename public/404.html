<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found | Marquee</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Marquee: near-black, signal orange, Outfit display type, and a row of architectural fins with one missing */
  :root { --bg: #050505; --ink: #f5f5f5; --muted: #a3a3a3; --line: rgba(255,255,255,.1); --orange: #FF7A00; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; overflow-x: hidden; }
  header { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding: 24px clamp(16px, 4vw, 48px); border-bottom: 1px solid var(--line); }
  .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .2em; text-transform: uppercase; }
  .brand svg { width: 40px; height: 40px; color: var(--orange); }
  .links { display: flex; gap: 28px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  .links a { color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  .links a:hover { color: var(--ink); }
  main { position: relative; flex: 1; display: grid; align-items: center; padding: 40px clamp(16px, 6vw, 96px) 80px; overflow: hidden; }
  /* the fin wall: vertical uPVC fins, one gap where the page should be */
  .fins { position: absolute; inset: 0; display: flex; justify-content: center; gap: clamp(14px, 3vw, 40px); padding: 0 4vw; pointer-events: none;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); mask-image: linear-gradient(90deg, transparent, #000 25%, #000 75%, transparent); opacity: .5; }
  .fins i { flex: none; width: clamp(10px, 1.6vw, 22px); height: 100%; background: linear-gradient(90deg, #141414 0%, #2a2a2a 45%, #121212 100%);
    transform: skewY(-8deg); transform-origin: top; animation: rise 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .fins i.gap { background: none; border: 1px dashed rgba(255,122,0,.6); }
  @keyframes rise { from { transform: skewY(-8deg) scaleY(0); } }
  .wrap { position: relative; max-width: 760px; }
  .tag { margin: 0 0 18px; color: var(--orange); font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .3em; text-transform: uppercase; }
  h1 { margin: 0; font-family: 'Outfit', sans-serif; font-weight: 900; font-size: clamp(110px, 25vw, 260px); line-height: .82; letter-spacing: -.04em; text-transform: uppercase; }
  h1 span { color: var(--orange); }
  h2 { margin: 22px 0 12px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: clamp(26px, 4.4vw, 44px); line-height: 1.1; letter-spacing: -.01em; }
  p { margin: 0 0 34px; max-width: 46ch; color: var(--muted); font-size: 17px; line-height: 1.65; }
  .ctas { display: flex; flex-wrap: wrap; gap: 12px; }
  .ctas a { display: inline-flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 26px; border: 1px solid rgba(255,255,255,.25); color: var(--ink);
    font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; text-decoration: none; transition: background .25s, border-color .25s, color .25s; }
  .ctas a.primary { background: var(--orange); border-color: var(--orange); color: #0a0a0a; }
  .ctas a:hover { border-color: var(--orange); }
  .ctas a.primary:hover { background: #ff9a3d; }
  a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
  footer { padding: 22px clamp(16px, 4vw, 48px); border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #737373; }
  footer a { color: inherit; }
  @media (max-width: 700px) { .links { display: none; } .ctas a { flex: 1 1 100%; justify-content: center; } }
  @media (prefers-reduced-motion: reduce) { .fins i { animation: none; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Marquee home">
    <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M 20 10 L 20 80 M 80 10 L 80 80 M 20 10 L 50 80 L 80 10 M 20 80 L 35 25 L 50 50 L 65 25 L 80 80 M 15 92 L 85 92"/></svg>
    Marquee
  </a>
  <nav class="links" aria-label="Main"><a href="/#about">About</a><a href="/#products">Products</a><a href="/projects">Projects</a><a href="/#contact-form">Contact</a></nav>
</header>
<main>
  <div class="fins" aria-hidden="true" id="fins"></div>
  <div class="wrap">
    <p class="tag">Error &middot; 404</p>
    <h1>4<span>0</span>4</h1>
    <h2>This page isn't on the elevation.</h2>
    <p>The link may be old, or the page has moved. Our fins, louvers and finished projects are a click away.</p>
    <div class="ctas">
      <a class="primary" href="/">Back to home</a>
      <a href="/projects">View projects</a>
      <a href="/#contact-form">Contact us</a>
    </div>
  </div>
</main>
<footer><span>&copy; 2026 Marquee uPVC Architectural Fins</span><a href="/privacy.html">Privacy</a></footer>
<script>
  // build the fin wall; one fin is "missing"
  (function () {
    var box = document.getElementById("fins"), n = window.innerWidth < 700 ? 9 : 16, gap = Math.floor(n * 0.62);
    for (var i = 0; i < n; i++) { var f = document.createElement("i"); if (i === gap) f.className = "gap"; f.style.animationDelay = i * 0.04 + "s"; box.appendChild(f); }
  })();
</script>
</body>
</html>
